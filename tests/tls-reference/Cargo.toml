[package]
name = "hibana-quic-reference-tls"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Allocating rustls QUIC TLS reference backend for development; not the no_alloc release backend"

[dependencies]
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "6e5ece518c30a1478f75f17d23aec72b10208fd8", default-features = false }
hibana-quic-pal = { path = "../../pal" }
rustls-pki-types = { version = "=1.15.1", default-features = false }
hibana = { version = "=0.9.9", default-features = false }
hibana-quic = { path = "../.." }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
der = { version = "=0.7.10", default-features = false }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }

# Qualify the projection repair before releasing a new crate.
[patch.crates-io]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "40b544895081c952d719444b5fadcd2e953e165e" }

[package]
name = "hibana-quic-reference-tls"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Allocating rustls QUIC TLS reference backend for development; not the no_alloc release backend"

[dependencies]
hibana-quic-host = { path = "../../host" }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["alloc"] }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "6fccdbf81038b00d99ec1bb2b9c43a487521628e", default-features = false }
hibana-quic = { path = "../.." }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "b5cd10fcabb26ed0b121ae9a192b4c254f000426", default-features = false }
der = { version = "=0.7.10", default-features = false }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }

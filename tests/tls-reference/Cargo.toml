[package]
name = "hibana-quic-reference-tls"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Allocating rustls QUIC TLS reference backend for development; not the no_alloc release backend"

[dependencies]
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "7c06688e0e90841d1760b7ef95f22080c30ce493", default-features = false }
hibana-quic-pal = { path = "../../pal" }
rustls-pki-types = { version = "=1.15.1", default-features = false }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "66a28e86e0a27de408bc62c0d20a6ead0e3d9a70", default-features = false }
hibana-quic = { path = "../.." }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
der = { version = "=0.7.10", default-features = false }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }


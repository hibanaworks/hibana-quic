[package]
name = "hibana-quic-reference-tls"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Allocating rustls QUIC TLS reference backend for development; not the no_alloc release backend"

[dependencies]
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "f0ca857c34466672195124f53bd26749920a2a2c", default-features = false }
hibana-quic-pal = { path = "../../pal" }
rustls-pki-types = { version = "=1.15.1", default-features = false }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "abe617ea3ff97a5b0e6327013149a8b21721df5c", version = "=0.10.0", default-features = false }
hibana-quic = { path = "../.." }
rustls = { version = "=0.23.45", default-features = false, features = ["std", "ring"] }

[dev-dependencies]
der = { version = "=0.7.10", default-features = false }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }


[lints.rust]
long_running_const_eval = "forbid"

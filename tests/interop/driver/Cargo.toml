[package]
name = "hibana-quic-interop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autoexamples = false
license = "MIT OR Apache-2.0"

[workspace]
resolver = "3"

[dependencies]
hibana-quic = { path = "../../..", default-features = false }
hibana-quic-pal = { path = "../../../pal" }
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "6e5ece518c30a1478f75f17d23aec72b10208fd8", default-features = false }
hibana = { version = "=0.9.9", default-features = false }

[[bin]]
name = "hq"
path = "src/main.rs"
required-features = ["hq"]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"

[[test]]
name = "rsa_vectors"
path = "../../tls-reference/tests/rsa_vectors.rs"

[[test]]
name = "resumption"
path = "../../tls-reference/tests/resumption.rs"

[[test]]
name = "early_tls"
path = "../../tls-reference/tests/early_tls.rs"


[features]
default = []
hq = ["hibana-quic/hq", "hibana-tls/hq"]

# Qualify the projection repair before releasing a new crate.
[patch.crates-io]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "c03c7af337de6d00c150039450ddb0825b39e3a8" }

[package]
name = "hibana-quic-interop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autoexamples = false
license = "MIT OR Apache-2.0"

[workspace]
resolver = "3"

[dependencies]
hibana-quic = { path = "../../..", default-features = false }
hibana-quic-pal = { path = "../../../pal" }
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "51ba20900c69041e4cb88b009104b76ddbfabce8", default-features = false }
hibana = { version = "=0.9.7", default-features = false }

[[bin]]
name = "hq"
path = "src/main.rs"
required-features = ["hq"]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"

[[test]]
name = "rsa_vectors"
path = "../../tls-reference/tests/rsa_vectors.rs"

[[test]]
name = "resumption"
path = "../../tls-reference/tests/resumption.rs"

[[test]]
name = "early_tls"
path = "../../tls-reference/tests/early_tls.rs"


[features]
default = []
hq = ["hibana-quic/hq", "hibana-tls/hq"]

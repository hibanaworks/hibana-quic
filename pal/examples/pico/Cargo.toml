[package]
name = "hibana-quic-pico-example"
version = "0.1.0"
edition = "2024"
publish = false
[workspace]
[dependencies]
hibana-quic = { path = "../../..", default-features = false }
hibana = { version = "=0.9.9", default-features = false }

[features]
default = []
hq = ["hibana-quic/hq"]

# Qualify the projection repair before releasing a new crate.
[patch.crates-io]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "64d4f4966403c967f2b80393acec2c36556bfc5c" }

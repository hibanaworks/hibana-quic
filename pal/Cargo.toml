[package]
name = "hibana-quic-pal"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Environment access for hibana-quic: native UDP, readiness, clock, entropy and files"

[workspace]
resolver = "3"

[dependencies]
hibana-quic = { path = "..", default-features = false }

# Qualify the projection repair before releasing a new crate.
[patch.crates-io]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "ef65f0956104441a7bcf2dc4eabbc62930e4c30d" }

name: Direct choreography runtime checks
on:
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', 'examples/**', 'pal/**', 'tools/ci/**', 'Cargo.toml', 'Cargo.lock', '.github/workflows/direct-runtime.yml', '.github/workflows/interop-pilot.yml']
  workflow_dispatch:
    inputs:
      check:
        description: Check to run
        type: choice
        required: true
        default: all
        options: [all, rust, diagnostics, hq-large]
permissions:
  contents: read
concurrency:
  group: direct-runtime-${{ github.ref }}${{ inputs.check == 'hq-large' && '-hq-large' || '' }}
  cancel-in-progress: false
defaults:
  run:
    working-directory: hibana-quic
jobs:
  rust:
    if: inputs.check != 'hq-large'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hibana-quic
          persist-credentials: false
      - name: Put build and Miri outputs in the runner temporary directory
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
      - name: Read the immutable TLS revision
        id: tls
        run: |
          rustup toolchain install stable --profile minimal
          CARGO_TARGET_DIR="$RUNNER_TEMP/source-check-target" cargo +stable run --locked --manifest-path tools/ci/source/Cargo.toml -- tls-revision . >> "$GITHUB_OUTPUT"
      - name: Check out the exact owned TLS source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hibanaworks/hibana-tls
          ref: ${{ steps.tls.outputs.revision }}
          path: hibana-tls
          persist-credentials: false
      - name: Install stable Rust
        if: inputs.check != 'diagnostics'
        run: rustup toolchain install stable --profile minimal --component clippy --target thumbv6m-none-eabi
      - name: Verify both sources and dependency identities
        run: |
          cargo +stable test --locked --manifest-path tools/ci/source/Cargo.toml
          cargo +stable run --locked --manifest-path tools/ci/source/Cargo.toml -- audit .
          cargo +stable run --locked --manifest-path tools/ci/source/Cargo.toml -- dependencies .
          cargo +stable run --locked --manifest-path tools/ci/source/Cargo.toml -- stage . .ci-work/paired-source
      - name: Core, TLS, integration and compile-fail contracts
        if: inputs.check != 'diagnostics'
        run: |
          cargo +stable test --locked
          cargo +stable test --locked --features hq
          cargo +stable test --locked --manifest-path ../hibana-tls/Cargo.toml
          cargo +stable test --locked --manifest-path ../hibana-tls/Cargo.toml --features hq
      - name: Embedded no_std sources
        if: inputs.check != 'diagnostics'
        run: |
          cargo +stable check --locked --lib --target thumbv6m-none-eabi
          cargo +stable check --locked --lib --features hq --target thumbv6m-none-eabi
          cargo +stable check --locked --manifest-path pal/examples/pico/Cargo.toml --target thumbv6m-none-eabi
          cargo +stable check --locked --manifest-path pal/examples/pico/Cargo.toml --features hq --target thumbv6m-none-eabi
          cargo +stable check --locked --manifest-path ../hibana-tls/Cargo.toml --lib --target thumbv6m-none-eabi
      - name: Independent reference workspace and Host tests
        if: inputs.check != 'diagnostics'
        run: |
          cargo +stable test --locked --manifest-path tests/tls-reference/Cargo.toml
          cargo +stable test --locked --manifest-path pal/Cargo.toml
          cargo +stable test --locked --manifest-path examples/Cargo.toml --features hq
          cargo +stable test --locked --manifest-path tests/interop/driver/Cargo.toml --features hq
      - name: Strict Clippy for QUIC, TLS and Host
        if: inputs.check != 'diagnostics'
        run: |
          cargo +stable clippy --locked --lib --tests -- -D warnings
          cargo +stable clippy --locked --manifest-path ../hibana-tls/Cargo.toml --all-targets -- -D warnings
          cargo +stable clippy --locked --manifest-path pal/Cargo.toml --all-targets -- -D warnings
          cargo +stable clippy --locked --manifest-path examples/Cargo.toml --features hq --all-targets -- -D warnings
          cargo +stable clippy --locked --manifest-path tests/interop/driver/Cargo.toml --features hq --all-targets -- -D warnings
      - name: Exact runner nine-certificate chain including zero-allocation assertion
        if: inputs.check != 'diagnostics'
        run: |
          source tools/ci/pins.env
          git clone --filter=blob:none https://github.com/quic-interop/quic-interop-runner.git "$RUNNER_TEMP/runner"
          git -C "$RUNNER_TEMP/runner" checkout --detach "$RUNNER_REVISION"
          mkdir -p "$RUNNER_TEMP/chain9"
          (cd "$RUNNER_TEMP/runner" && bash certs.sh "$RUNNER_TEMP/chain9" 9)
          HIBANA_RUNNER_CERTS_DIR="$RUNNER_TEMP/chain9" cargo +stable test --locked --manifest-path tests/tls-reference/Cargo.toml --test certificate_depth exact_runner_nine_chain_full_tls_handshake_allocate_zero -- --ignored --exact
      - name: Bounded diagnostics, source pairing and impairment fixtures
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py'
          python3 -m unittest discover -s tests/interop/native -p 'test_udp_impairment.py'
      - name: Save paired source identity
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-source-pair-${{ github.run_id }}-${{ github.run_attempt }}
          path: hibana-quic/.ci-work/paired-source/source-pair.json
          retention-days: 7
  secret-miri:
    if: github.event_name != 'workflow_dispatch' || inputs.check == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hibana-quic
          persist-credentials: false
      - name: Put build and Miri outputs in the runner temporary directory
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
      - id: tls
        run: |
          rustup toolchain install stable --profile minimal
          CARGO_TARGET_DIR="$RUNNER_TEMP/source-check-target" cargo +stable run --locked --manifest-path tools/ci/source/Cargo.toml -- tls-revision . >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hibanaworks/hibana-tls
          ref: ${{ steps.tls.outputs.revision }}
          path: hibana-tls
          persist-credentials: false
      - name: Install the specified Miri and rust-src
        run: rustup toolchain install nightly-2026-10-08 --profile minimal --component miri --component rust-src
      - name: Secret memory, carrier delegation and native wake ownership
        run: |
          cargo +nightly-2026-10-08 miri test --locked --manifest-path ../hibana-tls/Cargo.toml --lib secret::
          cargo +nightly-2026-10-08 miri test --locked --manifest-path ../hibana-tls/Cargo.toml --lib certificate::pem::
          MIRIFLAGS=-Zmiri-strict-provenance cargo +nightly-2026-10-08 miri test --locked --test carrier_delegation
          cargo +nightly-2026-10-08 miri test --locked --manifest-path pal/Cargo.toml --lib sys::wake::tests::
  ack-delay-faults:
    if: github.event_name != 'workflow_dispatch' || inputs.check == 'all'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hibana-quic
          persist-credentials: false
      - name: Put build and Miri outputs in the runner temporary directory
        run: |
          echo "CARGO_TARGET_DIR=$RUNNER_TEMP/target" >> "$GITHUB_ENV"
          echo "XDG_CACHE_HOME=$RUNNER_TEMP/cache" >> "$GITHUB_ENV"
      - id: tls
        run: |
          rustup toolchain install stable --profile minimal
          CARGO_TARGET_DIR="$RUNNER_TEMP/source-check-target" cargo +stable run --locked --manifest-path tools/ci/source/Cargo.toml -- tls-revision . >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hibanaworks/hibana-tls
          ref: ${{ steps.tls.outputs.revision }}
          path: hibana-tls
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Build one exact candidate for all fault cases
        run: |
          cargo +stable run --locked --manifest-path tools/ci/source/Cargo.toml -- stage . .ci-work/paired-source
          mkdir -p ci-safe-results
          cp .ci-work/paired-source/source-pair.json ci-safe-results/
          cargo +stable build --locked --release --manifest-path tests/interop/driver/Cargo.toml --features hq --bin hq
          sha256sum "$CARGO_TARGET_DIR/release/hq" > ci-safe-results/binary.sha256
      - name: Finite seven Handshake plus three short packet losses
        run: python3 tests/interop/native/reproduce_key_wait.py 3 --binary "$CARGO_TARGET_DIR/release/hq" --connections 1 --impairment loss --loss-scope global --timeout-seconds 120 --trace-routes --output ci-safe-results/key-wait.json
      - name: Finite slow path and three Finished losses
        run: python3 tests/interop/native/reproduce_slow_finished.py --binary "$CARGO_TARGET_DIR/release/hq" --connections 1 --impairment loss --timeout-seconds 180 --output ci-safe-results/slow-finished.json
      - name: Fifty concurrent connections, loss and corruption, five seeds each
        if: success() || failure()
        run: python3 tools/ci/run-ack-delay-stress.py --binary "$CARGO_TARGET_DIR/release/hq" --output ci-safe-results/stress
      - name: Retain actual fault and retirement reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ack-delay-faults-${{ github.run_id }}-${{ github.run_attempt }}
          path: hibana-quic/ci-safe-results/
          retention-days: 7

  application-examples:
    if: github.event_name != 'workflow_dispatch' || inputs.check == 'all' || inputs.check == 'hq-large'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.check == 'hq-large' && '[{"os":"ubuntu-24.04","example":"linux"}]' || '[{"os":"ubuntu-24.04","example":"linux"},{"os":"macos-15","example":"macos"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: hibana-quic
          persist-credentials: false
      - run: echo "CARGO_TARGET_DIR=$RUNNER_TEMP/examples-target" >> "$GITHUB_ENV"
      - run: rustup toolchain install stable --profile minimal
      - name: Read the immutable TLS revision for ARM tests
        if: runner.os == 'macOS'
        id: arm_tls
        run: CARGO_TARGET_DIR="$RUNNER_TEMP/source-check-target" cargo +stable run --locked --manifest-path tools/ci/source/Cargo.toml -- tls-revision . >> "$GITHUB_OUTPUT"
      - name: Check out the exact TLS source for ARM tests
        if: runner.os == 'macOS'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hibanaworks/hibana-tls
          ref: ${{ steps.arm_tls.outputs.revision }}
          path: hibana-tls
          persist-credentials: false
      - name: Execute the Apple ARM AES and GCM contracts
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          cargo +stable test --locked --manifest-path ../hibana-tls/Cargo.toml --lib crypto::aes128::tests::apple_aarch64_baseline_selects_hardware_aes -- --exact | tee "$RUNNER_TEMP/arm-aes-dispatch.log"
          grep -F 'test result: ok. 1 passed; 0 failed;' "$RUNNER_TEMP/arm-aes-dispatch.log"
          cargo +stable test --locked --manifest-path ../hibana-tls/Cargo.toml --lib crypto::aes128
          cargo +stable test --locked --manifest-path ../hibana-tls/Cargo.toml --lib crypto::aes128gcm
      - name: Verify native environment capabilities
        if: inputs.check != 'hq-large'
        run: |
          cargo +stable test --locked --manifest-path pal/Cargo.toml
          cargo +stable run --locked --manifest-path pal/Cargo.toml --example ${{ matrix.example }}
      - name: Compile and test the application localsides
        if: inputs.check != 'hq-large'
        run: |
          cargo +stable test --locked --manifest-path examples/Cargo.toml --features hq --examples
          cargo +stable build --locked --manifest-path examples/Cargo.toml --features hq --examples
          cargo +stable build --locked --release --manifest-path examples/Cargo.toml --features hq --examples
      - name: Build the HQ transfer diagnostic
        if: inputs.check == 'hq-large'
        id: hq_build
        run: |
          cargo +stable build --locked --manifest-path examples/Cargo.toml --features hq --example hq-client --example hq-server
          cargo +stable build --locked --release --manifest-path examples/Cargo.toml --features hq --example hq-client --example hq-server
      - name: Generate ephemeral example certificates
        id: example_certs
        run: |
          certs="$RUNNER_TEMP/example-certificates"
          mkdir -p "$certs"
          printf '[req]\ndistinguished_name=dn\n[dn]\n[ca]\nbasicConstraints=critical,CA:TRUE\nkeyUsage=critical,keyCertSign,cRLSign\n' > "$certs/request.cnf"
          openssl ecparam -name prime256v1 -genkey -noout -out "$certs/ca.key"
          openssl req -config "$certs/request.cnf" -extensions ca -new -x509 -sha256 -set_serial 1 -key "$certs/ca.key" -out "$certs/ca.pem" -days 1 -subj /CN=ExampleCA
          openssl ecparam -name prime256v1 -genkey -noout -out "$certs/server.key"
          openssl req -config "$certs/request.cnf" -new -key "$certs/server.key" -out "$certs/server.csr" -subj /CN=localhost
          printf 'subjectAltName=DNS:localhost\nbasicConstraints=critical,CA:FALSE\nkeyUsage=critical,digitalSignature\nextendedKeyUsage=serverAuth\n' > "$certs/extensions"
          openssl x509 -req -sha256 -set_serial 2 -in "$certs/server.csr" -CA "$certs/ca.pem" -CAkey "$certs/ca.key" -out "$certs/server.pem" -days 1 -extfile "$certs/extensions"
      - name: Authenticated raw QUIC and HTTP/3 exchanges
        if: inputs.check != 'hq-large'
        run: |
          certs="$RUNNER_TEMP/example-certificates"
          python3 tests/check_examples.py "$CARGO_TARGET_DIR/debug/examples" "$certs/server.pem" "$certs/server.key" "$certs/ca.pem" --hq
          python3 tests/check_examples.py "$CARGO_TARGET_DIR/release/examples" "$certs/server.pem" "$certs/server.key" "$certs/ca.pem" --hq
      - name: Debug HQ 1-MiB transfer
        if: inputs.check == 'hq-large'
        run: |
          certs="$RUNNER_TEMP/example-certificates"
          python3 tests/check_examples.py "$CARGO_TARGET_DIR/debug/examples" "$certs/server.pem" "$certs/server.key" "$certs/ca.pem" --hq-size 1048576
      - name: Release HQ 1-MiB transfer
        if: always() && inputs.check == 'hq-large' && steps.hq_build.outcome == 'success' && steps.example_certs.outcome == 'success'
        run: |
          certs="$RUNNER_TEMP/example-certificates"
          python3 tests/check_examples.py "$CARGO_TARGET_DIR/release/examples" "$certs/server.pem" "$certs/server.key" "$certs/ca.pem" --hq-size 1048576

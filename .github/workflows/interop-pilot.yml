name: QUIC interoperability pilot

on:
  push:
    branches: [development/rolled-route-runtime, ci/parallel-client-retirement]
    paths: ['src/**', 'examples/**', 'pal/src/**', 'Cargo.toml', 'Cargo.lock', 'pal/Cargo.toml', 'pal/Cargo.lock', tools/ci/pins.env, tools/ci/interop-request.json, tools/ci/run-interop.sh, tools/ci/run_in_tools.py, .github/workflows/interop-pilot.yml]
  workflow_dispatch:
    inputs:
      source_ref:
        description: Audited test branch or exact commit to test
        required: true
        default: ci/parallel-client-retirement
        type: string
      diagnostic_cases:
        description: Comma-separated registered cases to inspect; empty runs all 44 cells
        required: false
        default: ''
        type: string
      diagnostic_directions:
        description: Candidate directions for a diagnostic subset only
        required: false
        default: client,server
        type: choice
        options: [client, server, 'client,server']

permissions:
  contents: read
  actions: read

defaults:
  run:
    working-directory: hibana-quic

concurrency:
  group: quic-interop-pilot
  cancel-in-progress: false

jobs:
  plan:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      groups: ${{ steps.plan.outputs.groups }}
      source_commit: ${{ steps.plan.outputs.source_commit }}
      tls_revision: ${{ steps.tls.outputs.revision }}
    steps:
      - name: Check out the selected audited source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.sha }}
          path: hibana-quic
          persist-credentials: false
          fetch-depth: 1
      - name: Read the immutable TLS revision
        id: tls
        run: python3 tools/ci/tls-revision.py >> "$GITHUB_OUTPUT"
      - name: Check out the exact owned TLS source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hibanaworks/hibana-tls
          ref: ${{ steps.tls.outputs.revision }}
          path: hibana-tls
          persist-credentials: false
      - name: Validate all 44 cells and freeze the source commit
        id: plan
        env:
          INTEROP_DIAGNOSTIC_CASES: ${{ inputs.diagnostic_cases }}
          INTEROP_DIAGNOSTIC_DIRECTIONS: ${{ inputs.diagnostic_directions }}
        run: |
          python3 tools/ci/audit_source.py --check
          env -u INTEROP_DIAGNOSTIC_CASES -u INTEROP_DIAGNOSTIC_DIRECTIONS python3 -m unittest discover -s tests -p 'test_ci*.py'
          groups=$(ROOT="$PWD" python3 tools/ci/run_in_tools.py --matrix)
          echo "groups=$groups" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  pilot:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.groups) }}
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      PUBLIC_REPOSITORY: ${{ !github.event.repository.private }}
      INTEROP_GROUP: ${{ matrix.group }}
      INTEROP_DIAGNOSTIC_CASES: ${{ inputs.diagnostic_cases }}
      INTEROP_DIAGNOSTIC_DIRECTIONS: ${{ inputs.diagnostic_directions }}
    steps:
      - name: Check out the exact qualification commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_commit }}
          path: hibana-quic
          persist-credentials: false
          fetch-depth: 1
      - name: Check out the frozen owned TLS source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hibanaworks/hibana-tls
          ref: ${{ needs.plan.outputs.tls_revision }}
          path: hibana-tls
          persist-credentials: false
      - name: Run the pinned candidate interoperability subset
        timeout-minutes: 55
        run: timeout --signal=TERM --kill-after=30s 54m bash tools/ci/run-interop.sh
      - name: Upload sanitized reports and sealed failure evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interop-pilot-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.group }}
          path: hibana-quic/ci-safe-results/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
          include-hidden-files: false

  qualification:
    needs: [plan, pilot]
    if: always() && needs.plan.result == 'success' && inputs.diagnostic_cases == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ needs.plan.outputs.source_commit }}
    steps:
      - name: Check out the exact qualification commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ needs.plan.outputs.source_commit }}
          path: hibana-quic
          persist-credentials: false
          fetch-depth: 1
      - name: Check out the frozen owned TLS source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: hibanaworks/hibana-tls
          ref: ${{ needs.plan.outputs.tls_revision }}
          path: hibana-tls
          persist-credentials: false
      - name: Collect every group from this run and attempt
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --pattern "interop-pilot-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-*" \
            --dir .ci-work/matrix-artifacts
      - name: Require 44 actual candidate passes on one commit
        run: ROOT="$PWD" python3 tools/ci/run_in_tools.py --verify-matrix .ci-work/matrix-artifacts
      - name: Upload the verified qualification matrix
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interop-qualification-${{ github.run_id }}-${{ github.run_attempt }}
          path: hibana-quic/ci-safe-results/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
          include-hidden-files: false

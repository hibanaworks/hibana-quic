name: QUIC interoperability pilot

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Audited test branch or exact commit to test
        required: true
        default: ci/interop-pilot-20261002
        type: string

permissions:
  contents: read

concurrency:
  group: quic-interop-pilot
  cancel-in-progress: false

jobs:
  pilot:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      PUBLIC_REPOSITORY: ${{ !github.event.repository.private }}
    steps:
      - name: Check out the selected audited source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false
          fetch-depth: 1
      - name: Run the pinned baseline and explicit subset
        timeout-minutes: 55
        run: timeout --signal=TERM --kill-after=30s 54m bash ci/run-interop.sh
      - name: Upload only sanitized result evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: interop-pilot-${{ github.run_id }}-${{ github.run_attempt }}
          path: ci-safe-results/
          if-no-files-found: warn
          retention-days: 1
          compression-level: 9
          include-hidden-files: false

[package]
name = "hibana-quic-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Host adapters for the bounded hibana-quic TLS/transport profile; no reference TLS dependency"

[workspace]
resolver = "3"

[dependencies]
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "3b383f397599892d76760cb6902de21a1db3c3bb", default-features = false, features = ["alloc"] }
hibana-quic = { path = ".." }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "2eaba16d204a3f33f25ab00087d504380fe7e27f", default-features = false }


[[bin]]
name = "hq"
path = "src/bin/hq.rs"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"

[[test]]
name = "rsa_vectors"
path = "../tests/tls-reference/tests/rsa_vectors.rs"

[[test]]
name = "resumption"
path = "../tests/tls-reference/tests/resumption.rs"

[[test]]
name = "early_tls"
path = "../tests/tls-reference/tests/early_tls.rs"

[[example]]
name = "quic-client"
path = "../examples/hello-quic/client.rs"

[[example]]
name = "quic-server"
path = "../examples/hello-quic/server.rs"

[[example]]
name = "http3-client"
path = "../examples/hello-http3/client.rs"

[[example]]
name = "http3-server"
path = "../examples/hello-http3/server.rs"

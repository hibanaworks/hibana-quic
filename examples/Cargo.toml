[package]
name = "hibana-quic-examples"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autoexamples = false
license = "MIT OR Apache-2.0"

[workspace]
resolver = "3"

[dependencies]
hibana-quic = { path = "..", default-features = false }
hibana-quic-pal = { path = "../pal" }
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "d1fa6de16563afaede629159399965fbc7460133", default-features = false }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "6ed1923c9447e48cfd3e4bb0f2d6f12126e2b452", default-features = false }

[[bin]]
name = "hq"
path = "hq/main.rs"
required-features = ["hq"]

[profile.release]
codegen-units = 1
lto = true
panic = "abort"

[[test]]
name = "rsa_vectors"
path = "../tests/tls-reference/tests/rsa_vectors.rs"

[[test]]
name = "resumption"
path = "../tests/tls-reference/tests/resumption.rs"

[[test]]
name = "early_tls"
path = "../tests/tls-reference/tests/early_tls.rs"

[[example]]
name = "quic-client"
path = "hello-quic/client.rs"

[[example]]
name = "quic-server"
path = "hello-quic/server.rs"

[[example]]
name = "http3-client"
path = "hello-http3/client.rs"

[[example]]
name = "http3-server"
path = "hello-http3/server.rs"

[features]
default = []
hq = ["hibana-quic/hq", "hibana-tls/hq"]

[[example]]
name = "hq-client"
path = "hello-hq/client.rs"
required-features = ["hq"]

[[example]]
name = "hq-server"
path = "hello-hq/server.rs"
required-features = ["hq"]

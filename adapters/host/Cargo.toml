[package]
name = "hibana-quic-host"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Host adapters for the bounded hibana-quic TLS/transport profile; no reference TLS dependency"

[workspace]
resolver = "3"

[dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["socket", "net", "uio", "event"] }
hibana-quic = { path = "../.." }
hibana = { path = "../../vendor/hibana", default-features = false }
rustls-pki-types = { version = "=1.15.1", default-features = false, features = ["alloc"] }
p256 = { version = "=0.13.2", default-features = false, features = ["ecdsa", "pkcs8"] }
rand_core = { version = "=0.6.4", features = ["getrandom"] }

[dev-dependencies]
der = { version = "=0.7.10", default-features = false }
pkcs1 = { version = "=0.7.5", default-features = false }
rcgen = { version = "=0.13.2", default-features = false, features = ["crypto", "ring"] }

[[bin]]
name = "bounded-handshake"
path = "../../reference-tls/src/bin/bounded-handshake.rs"

[[bin]]
name = "hq"
path = "../../reference-tls/src/bin/hq.rs"

[[test]]
name = "bounded_wire"
path = "../../reference-tls/tests/bounded_wire.rs"

[[test]]
name = "bounded_streams"
path = "../../reference-tls/tests/bounded_streams.rs"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"

[[test]]
name = "rsa_vectors"
path = "../../reference-tls/tests/rsa_vectors.rs"

[[test]]
name = "resumption"
path = "../../reference-tls/tests/resumption.rs"

[[test]]
name = "idle_wire"
path = "../../reference-tls/tests/idle_wire.rs"

[[test]]
name = "version_negotiation_wire"
path = "../../reference-tls/tests/version_negotiation_wire.rs"

[[test]]
name = "early_tls"
path = "../../reference-tls/tests/early_tls.rs"

[[test]]
name = "early_wire"
path = "../../reference-tls/tests/early_wire.rs"

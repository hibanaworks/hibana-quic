[package]
name = "hibana-quic"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Experimental bounded QUIC v1 transport driven by Hibana choreography"

[dependencies]
# The owned TLS repository is pinned to the same source checked out by CI.
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "3b383f397599892d76760cb6902de21a1db3c3bb", default-features = false }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "2eaba16d204a3f33f25ab00087d504380fe7e27f", default-features = false }

[features]
default = []
target-link-smoke = []

[[example]]
name = "thumb_link"
path = "tests/embedded/thumb_link.rs"
required-features = ["target-link-smoke"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1


[package.metadata.hibana-source]
repository = "https://github.com/hibanaworks/hibana"
branch = "development/rolled-route-ownership"
revision = "2eaba16d204a3f33f25ab00087d504380fe7e27f"
local-patches = false

[dev-dependencies]
actor-test-allocator = { path = "tests/support/actor-test-allocator" }

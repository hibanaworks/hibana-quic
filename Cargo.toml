[package]
name = "hibana-quic"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT OR Apache-2.0"
description = "Experimental bounded QUIC v1 transport driven by Hibana choreography"

[dependencies]
# The owned TLS repository is pinned to the same source checked out by CI.
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "5c6d2bec5150a900ba3bc6a19123eead2b1534b8", default-features = false }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "6fccdbf81038b00d99ec1bb2b9c43a487521628e", default-features = false }

[features]
default = []
target-link-smoke = []

[[example]]
name = "thumb_link"
path = "tests/embedded/thumb_link.rs"
required-features = ["target-link-smoke"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[package.metadata.validation]
connection-target-budget = "unavailable: legacy controller probes removed; recovered independent-role full-connection budget not measured"

[package.metadata.hibana-source]
repository = "https://github.com/hibanaworks/hibana"
branch = "development/rolled-route-ownership"
revision = "6fccdbf81038b00d99ec1bb2b9c43a487521628e"
local-patches = false

[dev-dependencies]
actor-test-allocator = { path = "tests/support/actor-test-allocator" }

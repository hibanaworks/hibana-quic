[package]
name = "hibana-quic"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autoexamples = false
license = "MIT OR Apache-2.0"
description = "Experimental QUIC v1/v2 and HTTP/3 using Hibana choreography, with no_std and no heap allocation"
repository = "https://github.com/hibanaworks/hibana-quic"
homepage = "https://hibanaworks.dev"
keywords = ["quic", "http3", "choreography", "no-std", "no-alloc"]
categories = ["asynchronous", "network-programming", "embedded"]

[dependencies]
# The owned TLS repository is pinned to the same source checked out by CI.
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "8a3e22e3331a55a363ae3bad397301c9cd840956", default-features = false }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "abe617ea3ff97a5b0e6327013149a8b21721df5c", version = "=0.10.0", default-features = false }

[features]
default = []
hq = ["hibana-tls/hq"]
target-link-smoke = []

[[example]]
name = "thumb_link"
path = "tests/embedded/thumb_link.rs"
required-features = ["target-link-smoke"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[package.metadata.hibana-source]
repository = "https://github.com/hibanaworks/hibana"
revision = "abe617ea3ff97a5b0e6327013149a8b21721df5c"
version = "0.10.0"

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
actor-test-allocator = { path = "tests/support/actor-test-allocator" }
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }

[lints.rust]
long_running_const_eval = "forbid"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hibana_profile)'] }

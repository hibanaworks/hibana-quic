[package]
name = "hibana-quic"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autoexamples = false
license = "MIT OR Apache-2.0"
description = "Experimental bounded QUIC v1 transport driven by Hibana choreography"

[dependencies]
# The owned TLS repository is pinned to the same source checked out by CI.
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "80f7ebdad3cd80718df10af1cd3555f0cf9f90aa", default-features = false }
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "af69def928f498ad474a4d2add238615e175a49b", default-features = false }

[features]
default = []
alloc = ["hibana-tls/alloc"]
target-link-smoke = []

[[example]]
name = "thumb_link"
path = "tests/embedded/thumb_link.rs"
required-features = ["target-link-smoke"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1


[package.metadata.hibana-source]
repository = "https://github.com/hibanaworks/hibana"
branch = "development/rolled-route-ownership"
revision = "af69def928f498ad474a4d2add238615e175a49b"
local-patches = false

[dev-dependencies]
actor-test-allocator = { path = "tests/support/actor-test-allocator" }

[package]
name = "hibana-quic"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
autoexamples = false
license = "MIT OR Apache-2.0"
description = "Experimental QUIC v1/v2 and HTTP/3 using Hibana choreography, with no_std and no heap allocation"
repository = "https://github.com/hibanaworks/hibana-quic"
homepage = "https://hibanaworks.dev"
keywords = ["quic", "http3", "choreography", "no-std", "no-alloc"]
categories = ["asynchronous", "network-programming", "embedded"]

[dependencies]
# The owned TLS repository is pinned to the same source checked out by CI.
hibana-tls = { git = "https://github.com/hibanaworks/hibana-tls", rev = "6e5ece518c30a1478f75f17d23aec72b10208fd8", default-features = false }
hibana = { version = "=0.9.9", default-features = false }

[features]
default = []
hq = ["hibana-tls/hq"]
target-link-smoke = []

[[example]]
name = "thumb_link"
path = "tests/embedded/thumb_link.rs"
required-features = ["target-link-smoke"]

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[package.metadata.hibana-source]
repository = "https://github.com/hibanaworks/hibana"
version = "0.9.9"
revision = "0a296df98be6664f07e426c086ffbb9486be7c71"

[target.'cfg(not(target_os = "none"))'.dev-dependencies]
actor-test-allocator = { path = "tests/support/actor-test-allocator" }

# Qualify the projection repair before releasing a new crate.
[patch.crates-io]
hibana = { git = "https://github.com/hibanaworks/hibana", rev = "0a296df98be6664f07e426c086ffbb9486be7c71" }
